name: JS Checks

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js-checks:
    uses: hemilabs/.github/.github/workflows/js-checks-pnpm.yml@6fd9422b57c759b4002957621c307d59a2c74edf # v1.5.0
    with:
      runs-on: ubuntu-24.04
