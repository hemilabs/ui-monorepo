enum RequestKind {
  DEPOSIT
  REDEEM
}

# Router-authoritative lifecycle status. Handlers guard transitions so a late
# cross-chain event can never move a request back to an earlier status.
enum RequestStatus {
  PENDING
  FULFILLED
  CANCELLED
  FINALIZED
  RECOVERED
}

type Request {
  amountIn: BigInt
  amountOut: BigInt
  amountOutMin: BigInt
  asset: String
  automatic: Boolean
  cancellationRequested: Boolean!
  cancellationRequestedAt: BigInt
  cancelledAmount: BigInt
  claimableAt: BigInt
  claimTxHash: String
  failed: Boolean!
  # raw `reason` bytes from the Agent's RequestFailed event
  failureReason: String
  finalizedAt: BigInt
  fulfilledAt: BigInt
  id: ID!
  initiator: String @index # indexed: looked up per initiator
  kind: RequestKind
  processedAt: BigInt
  processTxHash: String
  receivedAt: BigInt
  receiver: String @index # indexed: cost basis is looked up per receiver
  recoverTxHash: String
  requestedAt: BigInt
  requestId: BigInt!
  requestTxHash: String
  retryCount: Int!
  stakedAmount: BigInt
  status: RequestStatus!
}

# Genuine wallet-to-wallet share transfers for FMV pricing: mints, burns, and the
# Router's in-transit deposit/redeem legs are all excluded by the handler.
type ShareTransfer {
  from: String! @index
  id: ID!
  share: String!
  timestamp: BigInt!
  to: String! @index
  value: BigInt!
}

# Share->asset rate points reconstructed as num/den from each processed
# deposit/redeem, since the vault's convertToAssets lives on another chain.
# rateNumerator is the pegged staked/unstaked amount (the cost-basis unit),
# NOT the underlying asset's unit; `asset` is only the timeline grouping key.
type RateSnapshot {
  asset: String! @index
  id: ID!
  rateDenominator: BigInt!
  rateNumerator: BigInt!
  timestamp: BigInt!
}
