type LockedPosition @entity(immutable: false) {
  amount: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  forfeitable: Boolean!
  lockTime: BigInt!
  id: String!
  owner: Bytes!
  pastOwners: [Bytes!]!
  status: String!
  timestamp: BigInt!
  tokenId: BigInt!
  transactionHash: Bytes!
  transferable: Boolean!
  unlockTime: BigInt!
}

type LockStats @entity(immutable: false) {
  activeLocks: Int!
  id: String!
  totalLockDuration: BigInt!
}
