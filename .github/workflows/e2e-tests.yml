# Kept apart from js-checks so it is not a required status check while the
# e2e suite settles. Once it proves stable, it can be made required or merged
# into js-checks.
name: E2E Tests

on:
  pull_request:
    paths:
      - '.github/workflows/e2e-tests.yml'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'portal/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-portal-e2e-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hemilabs/actions/setup-node-env@34879d59453841c18fd53190b39251a5c566f8db # v3.0.0
        with:
          package-manager: pnpm
      - run: pnpm --filter portal test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: portal/playwright-report/
          retention-days: 5
    timeout-minutes: 15
