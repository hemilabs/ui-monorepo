name: Docker Build and Push

description: Build and push Docker images

inputs:
  context:
    description: 'The build context'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path (relative to the workspace). Defaults to <context>/Dockerfile.'
    required: false
    default: ''
  dockerHubPassword:
    description: 'Docker Hub token'
    required: true
  dockerHubUsername:
    description: 'Docker Hub username'
    required: true
  images:
    description: 'The Docker image name'
    required: true
  version:
    description: 'The version of the image'
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.images }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha,prefix=
          type=semver,pattern={{version}},value=${{ inputs.version }}
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        password: ${{ inputs.dockerHubPassword }}
        username: ${{ inputs.dockerHubUsername }}
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        provenance: true
        push: true
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
